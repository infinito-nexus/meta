name: Build & Publish MIG Image

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 3 * * 0" # weekly Sunday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'refs/heads/main' || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the release this run builds
        id: release
        if: github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(bash scripts/publish.sh release HEAD)"
          if [[ "${EVENT}" == push && "${REF_NAME}" != "v${version}" ]]; then
            echo "::error::${REF_NAME} is not the newest vX.Y.Z release of its commit (v${version})"
            exit 1
          fi
          commit="$(git rev-parse "v${version}^{commit}")"
          echo "release v${version} at ${commit}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

  test:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: meta
          ref: ${{ needs.release.outputs.commit }}

      - name: Checkout infinito-nexus/core
        uses: actions/checkout@v7
        with:
          repository: infinito-nexus/core
          path: infinito-nexus-core

      - name: Run every suite
        working-directory: meta
        run: make test

  e2e:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: meta
          ref: ${{ needs.release.outputs.commit }}

      - name: Checkout infinito-nexus/core
        uses: actions/checkout@v7
        with:
          repository: infinito-nexus/core
          path: infinito-nexus-core

      - name: Run E2E
        working-directory: meta
        run: make e2e

  compare:
    needs: release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.compare.outputs.push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare the rebuild with the published latest
        id: compare
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker build -t meta:candidate .
          push="$(bash scripts/publish.sh push-needed meta:candidate "${IMAGE}" "${VERSION}")"
          echo "push=${push}" >> "${GITHUB_OUTPUT}"

  build:
    needs: [release, test, e2e, compare]
    if: needs.compare.outputs.push == 'true'
    name: Image ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [ amd64, arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Write the digest to a file
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the ${{ matrix.architecture }} digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Download every architecture's digest
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both digests as one multi-architecture image
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          listed="$(bash "${GITHUB_WORKSPACE}/scripts/publish.sh" tags "${IMAGE}" "${VERSION}" "$(date -u +%s)")"
          mapfile -t refs <<<"${listed}"
          digests=(*)
          docker buildx imagetools create \
            "${refs[@]/#/--tag=}" \
            "${digests[@]/#/${IMAGE}@sha256:}"

      - name: Check that latest and every release prefix are one image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bash scripts/publish.sh manifest "${IMAGE}" "${VERSION}"

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect "${IMAGE}:latest"
